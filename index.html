<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produção de Estribos</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#18212b;--muted:#6c7784;--line:#e3e8ed;--blue:#1769aa;--red:#b42318;--shadow:0 8px 24px rgba(25,45,65,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{font-size:21px;font-weight:750}.who{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:15px;box-shadow:var(--shadow)}h2{font-size:17px;margin:0 0 15px}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650}.btn.secondary{background:#edf2f6;color:#253444}.btn.danger{background:#fff0ef;color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:var(--muted)}input,select{width:100%;min-height:42px;border:1px solid #d7dee5;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}input:focus,select:focus{outline:2px solid #bfddf5;border-color:var(--blue)}.total{min-height:42px;background:#f0f5f8;padding:11px;border-radius:8px;font-weight:750}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.sectionhead h2{margin:0}.tools{display:flex;align-items:center;gap:8px}.tools select{min-width:150px}.groups{display:grid;gap:12px}.operator{border:1px solid var(--line);border-radius:10px;overflow:hidden}.operator-title{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:#f7f9fb;font-weight:700}.count,.pager{font-size:12px;color:var(--muted);font-weight:500}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:730px}th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);font-size:13px}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.25px}td.num,th.num{text-align:right}.rowactions{text-align:right;white-space:nowrap}.pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:9px;border-top:1px solid var(--line)}.empty{text-align:center;padding:20px;color:var(--muted);font-size:14px}.login{max-width:430px;margin:9vh auto}.login .brand{margin-bottom:16px}.login .field{margin:13px 0}.login .btn{width:100%}.hidden{display:none!important}.status{margin-top:10px;color:var(--red);font-size:13px;line-height:1.45;white-space:pre-wrap}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#18212b;color:#fff;padding:11px 15px;border-radius:9px;z-index:10;font-size:14px}.demo{color:#875c00;background:#fff4d6;padding:9px 11px;border-radius:8px;font-size:12px;margin-bottom:12px}
@page{size:A4 landscape;margin:12mm}@media print{body{background:white}.wrap,.toast{display:none!important}#printArea{display:block!important;font-family:Arial,sans-serif}.ptitle{font-size:18px;margin:0 0 5px}.pmeta{font-size:10px;margin-bottom:12px}.pgroup{break-inside:avoid;margin-bottom:15px}.pgroup h2{font-size:13px;background:#eee;padding:6px;margin:0}.pgroup table{width:100%;min-width:0;border-collapse:collapse}.pgroup th,.pgroup td{border:1px solid #aaa;padding:5px;font-size:9px}.psum{text-align:right;font-weight:bold;font-size:10px;margin-top:4px}}#printArea{display:none}
@media(max-width:760px){.wrap{padding:14px 11px 32px}.card{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start}.brand{font-size:18px}.who{font-size:12px;flex-wrap:wrap;justify-content:flex-end}.sectionhead{align-items:flex-start;flex-direction:column}.tools{width:100%;flex-wrap:wrap}.tools select{flex:1}.actions .btn{flex:1}}
</style>
</head><body>
<div id="login" class="wrap login"><div class="brand">Produção de Estribos</div><section class="card"><h2>Entrar</h2><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" placeholder="seu e-mail"></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="sua senha"></div><button id="loginBtn" class="btn">Entrar</button><div id="loginError" class="status hidden"></div></section></div>
<div id="app" class="wrap hidden"><header class="top"><div class="brand">Produção de Estribos</div><div class="who"><span id="roleLabel"></span><button id="logoutBtn" class="btn secondary small">Sair</button></div></header>
<section id="formCard" class="card hidden"><h2 id="formTitle">Registrar produção</h2><div class="grid"><div class="field"><label for="date">Data</label><input id="date" type="date"></div><div id="operatorWrap" class="field"><label for="operator">Operador</label><select id="operator"><option>Fernando</option><option>Angelo</option><option>Denerval</option></select></div><div class="field"><label for="gauge">Bitola (mm)</label><select id="gauge"><option>3,8</option><option>4,2</option><option>5,0</option><option>6,0</option></select></div><div class="field"><label for="measure">Medida do estribo</label><input id="measure" type="text" maxlength="40" placeholder="Ex.: 20 x 20 cm"></div><div class="field"><label for="kind">Tipo</label><select id="kind"><option>PACOTE</option><option>AMARRADO</option><option>CAIXA</option><option>M.LIVRE</option></select></div><div class="field"><label for="pieces">Qtd. peças por unidade</label><input id="pieces" type="number" min="1" step="1" inputmode="numeric" placeholder="0"></div><div class="field"><label for="units">Qtd. de unidades</label><input id="units" type="number" min="1" step="1" inputmode="numeric" placeholder="0"></div><div class="field"><label>Total de peças</label><div id="total" class="total">0</div></div></div><div class="actions"><button id="cancelBtn" class="btn secondary hidden">Cancelar</button><button id="saveBtn" class="btn">Salvar produção</button></div></section>
<section class="card"><div class="sectionhead"><h2 id="panelTitle">Produção</h2><div class="tools"><select id="dateFilter" aria-label="Filtrar período"><option value="all">Todas as datas</option><option value="today">Hoje</option><option value="month">Este mês</option></select><button id="excelBtn" class="btn secondary small hidden">Excel</button><button id="pdfBtn" class="btn secondary small hidden">PDF</button></div></div><div id="records" class="groups"><div class="empty">Carregando…</div></div></section></div>
<div id="toast" class="toast hidden"></div><div id="printArea"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
'use strict';
// O Project URL do projeto ohtrlfyncanrqjukaggo já está preenchido.
// Cole aqui a Publishable key sb_publishable_ copiada do Supabase. Nunca use Secret/service_role.
const SUPABASE_URL='https://ohtrlfyncanrqjukaggo.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Yaa1244QiYU1SemZlpTrgA_eLdUGuow';
const PAGE_SIZE=4,operators=['Fernando','Angelo','Denerval'],gauges=['3,8','4,2','5,0','6,0'],kinds=['PACOTE','AMARRADO','CAIXA','M.LIVRE'];
const $=id=>document.getElementById(id);let client=null,user=null,profile=null,editingId=null,allRows=[],pages={};
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function message(el,s){el.textContent=s;el.classList.toggle('hidden',!s)}
function admin(){return profile?.role==='master'}function readAll(){return profile?.role==='master'||profile?.role==='administration'}
function setBusy(b){$('loginBtn').disabled=b;$('saveBtn').disabled=b}
function total(){let p=Number($('pieces').value)||0,u=Number($('units').value)||0;$('total').textContent=(p*u).toLocaleString('pt-BR')}
function fmtDate(s){if(!s)return '';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00');return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===s}
function filtered(){const f=$('dateFilter').value,n=today();return allRows.filter(r=>f==='today'?r.production_date===n:f==='month'?r.production_date.slice(0,7)===n.slice(0,7):true)}
async function loadRows(){const {data,error}=await client.from('productions').select('id,production_date,operator,gauge,measure,package_type,pieces_per_unit,units,total_pieces,created_at').order('production_date',{ascending:false}).order('created_at',{ascending:false});if(error)throw error;allRows=data||[];render()}
function render(){const rows=filtered(),host=$('records');host.replaceChildren();const ops=readAll()?operators:[profile?.display_name];if(!rows.length){host.innerHTML='<div class="empty">Nenhuma produção registrada.</div>';return}for(const op of ops){const list=rows.filter(r=>r.operator===op);if(!list.length)continue;const pc=Math.max(1,Math.ceil(list.length/PAGE_SIZE));pages[op]=Math.min(pages[op]||0,pc-1);const pg=pages[op],shown=list.slice(pg*PAGE_SIZE,(pg+1)*PAGE_SIZE);const box=document.createElement('section');box.className='operator';const title=document.createElement('div');title.className='operator-title';const sum=list.reduce((a,r)=>a+Number(r.total_pieces),0);title.innerHTML=`<span>${esc(op)}</span><span class="count">${sum.toLocaleString('pt-BR')} peças</span>`;box.appendChild(title);const wrap=document.createElement('div');wrap.className='tablewrap';const table=document.createElement('table');table.innerHTML='<thead><tr><th>Data</th><th>Bitola</th><th>Medida</th><th>Tipo</th><th class="num">Pç/unid.</th><th class="num">Unidades</th><th class="num">Total pç</th><th></th></tr></thead>';const body=document.createElement('tbody');for(const r of shown){const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(fmtDate(r.production_date))}</td><td>${esc(r.gauge)} mm</td><td>${esc(r.measure)}</td><td>${esc(r.package_type)}</td><td class="num">${Number(r.pieces_per_unit).toLocaleString('pt-BR')}</td><td class="num">${Number(r.units).toLocaleString('pt-BR')}</td><td class="num"><strong>${Number(r.total_pieces).toLocaleString('pt-BR')}</strong></td><td class="rowactions">${admin()?`<button class="btn secondary small" data-edit="${esc(r.id)}">Alterar</button> <button class="btn danger small" data-delete="${esc(r.id)}">Apagar</button>`:''}</td>`;body.appendChild(tr)}table.appendChild(body);wrap.appendChild(table);box.appendChild(wrap);if(pc>1){const pager=document.createElement('div');pager.className='pager';pager.innerHTML=`<button class="btn secondary small" data-op="${esc(op)}" data-delta="-1" ${pg===0?'disabled':''}>Anterior</button><span>${pg*PAGE_SIZE+1}–${Math.min((pg+1)*PAGE_SIZE,list.length)} de ${list.length}</span><button class="btn secondary small" data-op="${esc(op)}" data-delta="1" ${pg>=pc-1?'disabled':''}>Próxima</button>`;box.appendChild(pager)}host.appendChild(box)}host.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>beginEdit(b.dataset.edit));host.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteRow(b.dataset.delete));host.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{pages[b.dataset.op]=(pages[b.dataset.op]||0)+Number(b.dataset.delta);render()})}
function roleUI(){ $('roleLabel').textContent=profile.display_name;$('panelTitle').textContent=readAll()?'Produção dos 3 operadores':'Minha produção';$('formCard').classList.toggle('hidden',profile.role==='administration');$('operatorWrap').classList.toggle('hidden',!admin());$('excelBtn').classList.toggle('hidden',!readAll());$('pdfBtn').classList.toggle('hidden',!readAll());if(!admin())$('operator').value=profile.display_name}
async function enterSession(session){user=session.user;const {data,error}=await client.from('app_profiles').select('display_name,role').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!data){await client.auth.signOut();throw Error('Esta conta ainda não está associada a um perfil. Peça ao Admin Master para conferir app_profiles.')}profile=data;roleUI();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('date').value=today();await loadRows()}
async function login(){message($('loginError'),'');if(!client){message($('loginError'),'Falta colocar a Publishable key no arquivo do app.');return}const email=$('email').value.trim(),password=$('password').value;if(!email||!password){message($('loginError'),'Informe o e-mail e a senha.');return}setBusy(true);try{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;await enterSession(data.session)}catch(e){message($('loginError'),e.message||'Não foi possível entrar. Confira o e-mail e a senha.')}finally{setBusy(false)}}
function resetForm(){editingId=null;$('formTitle').textContent='Registrar produção';$('saveBtn').textContent='Salvar produção';$('cancelBtn').classList.add('hidden');$('date').value=today();$('gauge').value='3,8';$('measure').value='';$('kind').value='PACOTE';$('pieces').value='';$('units').value='';if(admin())$('operator').value='Fernando';else if(profile)$('operator').value=profile.display_name;total()}
function beginEdit(id){if(!admin())return;const r=allRows.find(x=>String(x.id)===String(id));if(!r)return;editingId=r.id;$('formTitle').textContent='Alterar produção';$('saveBtn').textContent='Salvar alterações';$('cancelBtn').classList.remove('hidden');$('date').value=r.production_date;$('operator').value=r.operator;$('gauge').value=r.gauge;$('measure').value=r.measure||'';$('kind').value=r.package_type;$('pieces').value=r.pieces_per_unit;$('units').value=r.units;total();window.scrollTo({top:0,behavior:'smooth'})}
async function saveRow(){if(!profile||profile.role==='administration')return;const p=Number($('pieces').value),u=Number($('units').value),date=$('date').value,op=admin()?$('operator').value:profile.display_name;if(!Number.isSafeInteger(p)||p<1||!Number.isSafeInteger(u)||u<1||!Number.isSafeInteger(p*u)){toast('Informe quantidades inteiras válidas');return}const measure=$('measure').value.trim();if(!validDate(date)||!operators.includes(op)||!gauges.includes($('gauge').value)||!measure||measure.length>40||/[<>]/.test(measure)||!kinds.includes($('kind').value)){toast('Preencha uma medida válida do estribo');return}setBusy(true);const payload={production_date:date,operator:op,gauge:$('gauge').value,measure,package_type:$('kind').value,pieces_per_unit:p,units:u};try{let result;if(editingId){if(!admin())throw Error('Somente Fernando pode alterar registros.');result=await client.from('productions').update(payload).eq('id',editingId).select('id')}else{payload.created_by=user.id;result=await client.from('productions').insert(payload).select('id')}if(result.error)throw result.error;if(!result.data?.length)throw Error('O banco não confirmou a gravação. Confira as políticas de acesso.');const opName=op,wasEdit=!!editingId;resetForm();if(!wasEdit)pages[opName]=0;await loadRows();toast(wasEdit?'Alterações salvas':'Produção salva')}catch(e){toast(e.message||'Não foi possível salvar')}finally{setBusy(false)}}
async function deleteRow(id){if(!admin())return;const r=allRows.find(x=>String(x.id)===String(id));if(!r||!confirm('Apagar este registro?'))return;try{const {data,error}=await client.from('productions').delete().eq('id',id).select('id');if(error)throw error;if(!data?.length)throw Error('O banco não confirmou a exclusão.');await loadRows();toast('Registro apagado')}catch(e){toast(e.message||'Não foi possível apagar')}}
function exportCSV(){if(!readAll())return;const rows=filtered(),q=v=>'"'+String(v??'').replaceAll('"','""')+'"',lines=[['Operador','Data','Bitola mm','Medida','Tipo','Pecas por unidade','Unidades','Total de pecas'].join(';')];for(const op of operators){const list=rows.filter(r=>r.operator===op);for(const r of list)lines.push([op,fmtDate(r.production_date),r.gauge,r.measure,r.package_type,r.pieces_per_unit,r.units,r.total_pieces].map(q).join(';'));if(list.length)lines.push(['TOTAL '+op,'','','','','','',list.reduce((a,r)=>a+Number(r.total_pieces),0)].map(q).join(';'),'')}const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=us-ascii'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='producao_estribos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function printReport(){if(!readAll())return;const rows=filtered(),host=$('printArea');host.replaceChildren();const h=document.createElement('h1');h.className='ptitle';h.textContent='Relatorio de Producao de Estribos';host.appendChild(h);const meta=document.createElement('div');meta.className='pmeta';meta.textContent='Emitido em '+fmtDate(today());host.appendChild(meta);for(const op of operators){const list=rows.filter(r=>r.operator===op);if(!list.length)continue;const sec=document.createElement('section');sec.className='pgroup';const heading=document.createElement('h2');heading.textContent=op;sec.appendChild(heading);const table=document.createElement('table');table.innerHTML='<thead><tr><th>Data</th><th>Bitola mm</th><th>Medida</th><th>Tipo</th><th>Qtd pç/unidade</th><th>Unidades</th><th>Total peças</th></tr></thead>';const body=document.createElement('tbody');for(const r of list){const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(fmtDate(r.production_date))}</td><td>${esc(r.gauge)}</td><td>${esc(r.measure)}</td><td>${esc(r.package_type)}</td><td>${Number(r.pieces_per_unit)}</td><td>${Number(r.units)}</td><td>${Number(r.total_pieces)}</td>`;body.appendChild(tr)}table.appendChild(body);sec.appendChild(table);const sum=document.createElement('div');sum.className='psum';sum.textContent='Total: '+list.reduce((a,r)=>a+Number(r.total_pieces),0).toLocaleString('pt-BR')+' pecas';sec.appendChild(sum);host.appendChild(sec)}window.print()}
async function logout(){await client.auth.signOut();user=null;profile=null;allRows=[];editingId=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';message($('loginError'),'')}
function init(){if(!window.supabase){message($('loginError'),'Não foi possível carregar a biblioteca de conexão. Confira a internet.');return}if(!SUPABASE_PUBLISHABLE_KEY||SUPABASE_PUBLISHABLE_KEY==='COLE_AQUI_SUA_PUBLISHABLE_KEY'){message($('loginError'),'Cole a Publishable key no local indicado no código do app.');return}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logoutBtn').onclick=logout;$('pieces').oninput=total;$('units').oninput=total;$('saveBtn').onclick=saveRow;$('cancelBtn').onclick=resetForm;$('dateFilter').onchange=()=>{pages={};render()};$('excelBtn').onclick=exportCSV;$('pdfBtn').onclick=printReport;client.auth.getSession().then(async({data,error})=>{if(error)throw error;if(data.session){try{await enterSession(data.session)}catch(e){message($('loginError'),e.message||'Não foi possível carregar o perfil.')}}}).catch(e=>message($('loginError'),e.message||'Erro de conexão'))}
init();
})();
</script></body></html>
