input:focus,select:focus{outline:2px solid #f5b4b7;border-color:#e61923}

.operator-title{background:#f3f3f3}.goal-fill{background:#e61923}.goal-fill.complete{background:#171717}
.toast{background:#171717}

#formCard .field.is-invalid input,#formCard .field.is-invalid select{border:1px solid #c62828!important;box-shadow:0 0 0 2px rgba(198,40,40,.12)!important;background:#fffafa!important}
