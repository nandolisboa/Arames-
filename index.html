<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Pedidos · Estribos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --azul:#1d4ed8; --azul-esc:#1e3a8a;
    --cinza:#64748b; --borda:#cbd5e1;
    --bg:#eef2f7; --card:#fff;
    --vermelho:#dc2626; --verde:#15803d; --amarelo:#f59e0b;
  }
  body{
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:#0f172a; padding-bottom:40px;
  }

  /* ---------- TOPO / ABAS ---------- */
  .topo{background:var(--azul-esc);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .topo-inner{max-width:1100px;margin:0 auto;padding:10px 16px 0}
  .topo h1{font-size:18px;font-weight:600;letter-spacing:.3px;margin-bottom:10px}
  .tabs{display:flex;gap:6px}
  .tab-btn{
    background:rgba(255,255,255,.12);color:#dbeafe;border:none;
    padding:10px 18px;border-radius:8px 8px 0 0;cursor:pointer;
    font-size:14px;font-weight:600;transition:.15s;
  }
  .tab-btn:hover{background:rgba(255,255,255,.22)}
  .tab-btn.active{background:var(--bg);color:var(--azul-esc)}

  main{max-width:1100px;margin:18px auto;padding:0 16px}
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  /* ---------- CARDS / FORM ---------- */
  .card{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:16px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card h2{font-size:16px;color:var(--azul-esc);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--bg)}
  .card h3{font-size:14px;color:var(--cinza);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.6px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .campo{display:flex;flex-direction:column;gap:4px}
  .campo label{font-size:12px;font-weight:700;color:var(--cinza);text-transform:uppercase;letter-spacing:.4px}
  input[type=text],input[type=number],select{
    padding:10px 12px;border:1px solid var(--borda);border-radius:8px;
    font-size:14px;font-family:inherit;background:#fff;color:#0f172a;width:100%;
  }
  input:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(29,78,216,.15)}

  .btn-cliente{
    text-align:left;padding:10px 12px;border:2px dashed var(--azul);border-radius:8px;
    background:#eff6ff;color:var(--azul);font-weight:700;font-size:14px;cursor:pointer;width:100%;
  }
  .btn-cliente:hover{background:#dbeafe}
  .btn-cliente .vazio{color:var(--cinza);font-weight:500}

  .chk{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:14px;font-weight:600;color:var(--vermelho)}
  .chk input{width:20px;height:20px;accent-color:var(--vermelho)}

  button{font-family:inherit;cursor:pointer;font-size:14px;border-radius:8px;border:1px solid var(--borda);background:#fff;padding:10px 16px;font-weight:600;transition:.15s}
  button:hover{filter:brightness(.95)}
  .primario{background:var(--azul);color:#fff;border-color:var(--azul)}
  .primario:hover{background:var(--azul-esc)}
  .perigo{background:#fee2e2;color:var(--vermelho);border-color:#fca5a5}
  .perigo:hover{background:#fecaca}
  .sucesso{background:var(--verde);color:#fff;border-color:var(--verde)}

  /* ---------- ITEM FORM ---------- */
  .item-form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}
  @media(max-width:720px){.item-form{grid-template-columns:1fr 1fr}}

  .itens-temp{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .itens-temp li{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:#f8fafc;border:1px solid var(--borda);border-left:4px solid var(--azul);
    border-radius:8px;padding:8px 12px;font-size:13px;flex-wrap:wrap;
  }
  .itens-temp .medida{font-weight:700}
  .itens-temp .pac{background:#e0e7ff;color:var(--azul-esc);padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700}
  .itens-temp button{padding:4px 10px;font-size:12px}

  .acoes{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

  /* ---------- LISTA DE PEDIDOS ---------- */
  .secao-titulo{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;flex-wrap:wrap;gap:10px}
  .secao-titulo h2{font-size:18px;color:var(--azul-esc)}

  .pedido{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:6px solid var(--azul)}
  .pedido.urgente{border-left-color:var(--vermelho);background:#fff5f5}
  .pedido-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .pedido-cliente{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
  .tag-urgente{background:var(--vermelho);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.8px;margin-left:8px;animation:pisca 1.4s infinite}
  @keyframes pisca{50%{opacity:.55}}
  .pedido-data{font-size:12px;color:var(--cinza);font-weight:600}

  table.tabela{width:100%;border-collapse:collapse;font-size:13px}
  table.tabela th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--cinza);border-bottom:1px solid var(--borda);padding:5px 6px}
  table.tabela td{padding:6px;border-bottom:1px solid #eef2f7}
  table.tabela .num{text-align:right}
  table.tabela tfoot td{font-weight:800;border-top:2px solid var(--borda);border-bottom:none;padding-top:8px}

  .pedido-rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .info-extra{font-size:13px;color:var(--cinza)}
  .info-extra b{color:#0f172a}
  .pedido-acoes{display:flex;gap:8px;flex-wrap:wrap}
  .pedido-acoes button{padding:7px 14px;font-size:13px}

  .vazio{text-align:center;color:var(--cinza);padding:40px 10px;font-size:15px}

  /* ---------- CHÃO DE FÁBRICA ---------- */
  .fabrica-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .resumo-box{background:var(--azul-esc);color:#fff;border-radius:12px;padding:14px;text-align:center}
  .resumo-box.urg{background:var(--vermelho)}
  .resumo-box span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.85}
  .resumo-box strong{display:block;font-size:26px;margin-top:4px}

  .fabrica-card{background:#fff;border:2px solid var(--borda);border-radius:12px;padding:14px;margin-bottom:14px}
  .fabrica-card.urgente{border-color:var(--vermelho);box-shadow:0 0 0 3px rgba(220,38,38,.12)}
  .fabrica-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .fabrica-cliente{font-size:20px;font-weight:900;text-transform:uppercase}
  .fabrica-totais{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .fabrica-totais div{flex:1;min-width:90px;background:#f1f5f9;border-radius:10px;padding:8px;text-align:center}
  .fabrica-totais span{display:block;font-size:10px;text-transform:uppercase;color:var(--cinza);font-weight:700;letter-spacing:.6px}
  .fabrica-totais strong{font-size:22px;color:var(--azul-esc)}
  .fabrica-obs{margin-top:10px;background:#fffbeb;border-left:4px solid var(--amarelo);padding:8px 10px;border-radius:6px;font-size:13px}
  .fabrica-vazio{text-align:center;color:var(--cinza);padding:50px 10px}

  /* ---------- MODAL CLIENTE ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:100;
  }
  .overlay.aberto{display:flex}
  .modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .modal h3{font-size:18px;color:var(--azul-esc);margin-bottom:6px}
  .modal .hint{font-size:13px;color:var(--cinza);margin-bottom:14px}
  .modal input{font-size:16px;padding:12px}
  .modal-acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .erro{color:var(--vermelho);font-size:13px;font-weight:700;margin-top:8px}

  /* ---------- ÁREA DE IMPRESSÃO / PDF ---------- */
  #printArea{display:none}

  @media print{
    @page{size:A4 portrait;margin:10mm}
    body{background:#fff !important}
    header,main,.overlay{display:none !important}
    #printArea{display:block !important;color:#000;font-size:9pt}
    .pdf-header{border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-end}
    .pdf-header h1{font-size:13pt;letter-spacing:.5px}
    .pdf-header .pdf-sub{font-size:7.5pt;color:#333;text-align:right}
    .pdf-pedido{border:1px solid #888;border-radius:3px;padding:4px 6px;margin-bottom:5px;page-break-inside:avoid}
    .pdf-pedido-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #bbb;padding-bottom:2px;margin-bottom:3px;gap:6px}
    .pdf-cliente{font-weight:800;font-size:10pt;text-transform:uppercase;letter-spacing:.3px}
    .pdf-urgente{background:#000;color:#fff;font-size:6.5pt;padding:1px 5px;border-radius:2px;font-weight:800;letter-spacing:.6px}
    .pdf-data{font-size:7.5pt;color:#333;margin-left:auto}
    .pdf-tab{width:100%;border-collapse:collapse;font-size:8.5pt}
    .pdf-tab th,.pdf-tab td{border-bottom:1px solid #ddd;padding:1.5px 4px;text-align:left}
    .pdf-tab th{background:#eee;font-size:7.5pt;text-transform:uppercase;letter-spacing:.3px}
    .pdf-tab .num{text-align:right}
    .pdf-tab tfoot td{font-weight:800;border-top:1.5px solid #666;border-bottom:none}
    .pdf-info{font-size:7.5pt;margin-top:2px;display:flex;gap:14px;flex-wrap:wrap}
    .pdf-totais{margin-top:8px;border-top:2px solid #000;padding-top:5px;display:flex;justify-content:space-between;font-size:9pt;font-weight:800}
  }
</style>
</head>
<body>

<!-- ===================== TOPO ===================== -->
<header class="topo">
  <div class="topo-inner">
    <h1>Controle de Pedidos · Estribos</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="pedidos">1 · Lançamento de Pedidos</button>
      <button class="tab-btn" data-tab="fabrica">2 · Chão da Fábrica</button>
    </nav>
  </div>
</header>

<main>

  <!-- ===================== ABA 1 ===================== -->
  <section id="tab-pedidos" class="tab-panel active">

    <div class="card">
      <h2 id="tituloForm">Novo Lançamento de Pedido</h2>

      <div class="grid">
        <div class="campo">
          <label>Cliente * (obrigatório)</label>
          <button type="button" class="btn-cliente" id="btnAbrirCliente">
            <span id="clienteNome" class="vazio">Clique para informar o cliente</span>
          </button>
        </div>

        <div class="campo">
          <label>Urgência</label>
          <label class="chk">
            <input type="checkbox" id="urgente"> Pedido URGENTE
          </label>
        </div>

        <div class="campo">
          <label>KG (opcional)</label>
          <input type="number" id="kgPedido" step="0.01" min="0" placeholder="0,00">
        </div>

        <div class="campo">
          <label>Observação</label>
          <input type="text" id="obsPedido" placeholder="Opcional">
        </div>
      </div>

      <h3>Itens do pedido</h3>
      <div class="item-form">
        <div class="campo">
          <label>Medida do estribo</label>
          <input type="text" id="itemMedida" placeholder="Ex.: 10x20">
        </div>
        <div class="campo">
          <label>Material (mm)</label>
          <select id="itemMaterial">
            <option>3.8</option>
            <option selected>4.2</option>
            <option>5.0</option>
            <option>6.0</option>
          </select>
        </div>
        <div class="campo">
          <label>Qtd. de peças</label>
          <input type="number" id="itemQtd" min="1" step="1" placeholder="0">
        </div>
        <button type="button" class="primario" id="btnAddItem">+ Adicionar</button>
      </div>

      <ul class="itens-temp" id="listaItensTemp"></ul>

      <div class="acoes">
        <button type="button" class="primario" id="btnSalvar">Salvar lançamento</button>
        <button type="button" id="btnCancelar" hidden>Cancelar edição</button>
      </div>
    </div>

    <div class="secao-titulo">
      <h2>Pedidos lançados</h2>
      <button type="button" class="sucesso" id="btnPDFGeral">📄 Gerar PDF (todos)</button>
    </div>

    <div id="listaPedidos"></div>
  </section>

  <!-- ===================== ABA 2 ===================== -->
  <section id="tab-fabrica" class="tab-panel">
    <div class="fabrica-resumo" id="fabricaResumo"></div>
    <div id="fabricaLista"></div>
  </section>

</main>

<!-- ===================== MODAL CLIENTE ===================== -->
<div class="overlay" id="overlayCliente">
  <div class="modal">
    <h3>👤 Identificar Cliente</h3>
    <p class="hint">O nome do cliente é <b>obrigatório</b> para lançar o pedido.</p>
    <input type="text" id="inputCliente" list="sugestoesClientes" placeholder="Digite o nome do cliente" autocomplete="off">
    <datalist id="sugestoesClientes"></datalist>
    <p class="erro" id="erroCliente" hidden>⚠ Informe o nome do cliente.</p>
    <div class="modal-acoes">
      <button type="button" id="btnCancelarCliente">Cancelar</button>
      <button type="button" class="primario" id="btnConfirmarCliente">Confirmar</button>
    </div>
  </div>
</div>

<!-- ===================== ÁREA DE IMPRESSÃO ===================== -->
<div id="printArea"></div>

<script>
/* ============================================================
   CONFIGURAÇÃO
   ============================================================ */
const PECAS_POR_PACOTE = 500;
const MATERIAIS = ['3.8','4.2','5.0','6.0'];

/* ============================================================
   ESTADO
   ============================================================ */
const state = {
  pedidos: [],
  clientes: [],
  editandoId: null,
  clienteAtual: '',
  itens: []
};

const $ = s => document.querySelector(s);

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtQtd(n){ return Number(n||0).toLocaleString('pt-BR'); }
function fmtKg(n){ return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtData(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

/* REGRA DOS PACOTES: a cada 500 peças = 1 pacote.
   A variação (resto) NÃO precisa de pacote separado — ela
   completa o último pacote. Por isso usamos arredondamento
   para cima (Math.ceil). */
function pacotesDe(qtd){
  qtd = Number(qtd) || 0;
  if (qtd <= 0) return 0;
  return Math.ceil(qtd / PECAS_POR_PACOTE);
}
function detalhePacotes(qtd){
  const p = pacotesDe(qtd);
  if (!p) return '';
  const resto = qtd % PECAS_POR_PACOTE;
  if (resto === 0) return p + ' pacote(s) cheio(s)';
  return p + ' pacote(s) · último com ' + resto + ' pç';
}

/* ============================================================
   PERSISTÊNCIA
   ============================================================ */
function carregar(){
  try{
    state.pedidos  = JSON.parse(localStorage.getItem('estribos.pedidos')  || '[]');
    state.clientes = JSON.parse(localStorage.getItem('estribos.clientes') || '[]');
  }catch(e){ state.pedidos = []; state.clientes = []; }
}
function persistir(){
  localStorage.setItem('estribos.pedidos',  JSON.stringify(state.pedidos));
  localStorage.setItem('estribos.clientes', JSON.stringify(state.clientes));
}
function registrarCliente(nome){
  if (!state.clientes.some(c => c.toLowerCase() === nome.toLowerCase())) {
    state.clientes.push(nome);
    state.clientes.sort((a,b)=>a.localeCompare(b,'pt-BR'));
  }
}

/* ============================================================
   ABAS
   ============================================================ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.id === 'tab-' + btn.dataset.tab);
    });
    if (btn.dataset.tab === 'fabrica') renderFabrica();
  });
});

/* ============================================================
   MODAL CLIENTE (janelinha separada · obrigatório)
   ============================================================ */
function abrirModalCliente(){
  $('#inputCliente').value = state.clienteAtual || '';
  $('#erroCliente').hidden = true;
  $('#overlayCliente').classList.add('aberto');
  setTimeout(()=>$('#inputCliente').focus(), 60);
}
function fecharModalCliente(){
  $('#overlayCliente').classList.remove('aberto');
}
function confirmarCliente(){
  const nome = $('#inputCliente').value.trim();
  if (!nome){
    $('#erroCliente').hidden = false;
    $('#inputCliente').focus();
    return;
  }
  state.clienteAtual = nome;
  atualizarClienteUI();
  registrarCliente(nome);
  atualizarDatalist();
  fecharModalCliente();
}
function atualizarClienteUI(){
  const el = $('#clienteNome');
  if (state.clienteAtual){
    el.textContent = state.clienteAtual;
    el.classList.remove('vazio');
  } else {
    el.textContent = 'Clique para informar o cliente';
    el.classList.add('vazio');
  }
}
function atualizarDatalist(){
  $('#sugestoesClientes').innerHTML =
    state.clientes.map(c => `<option value="${esc(c)}">`).join('');
}

$('#btnAbrirCliente').addEventListener('click', abrirModalCliente);
$('#btnConfirmarCliente').addEventListener('click', confirmarCliente);
$('#btnCancelarCliente').addEventListener('click', fecharModalCliente);
$('#inputCliente').addEventListener('keydown', e => { if (e.key === 'Enter') confirmarCliente(); });
$('#overlayCliente').addEventListener('click', e => { if (e.target.id === 'overlayCliente') fecharModalCliente(); });

/* ============================================================
   ITENS DO PEDIDO (temporários)
   ============================================================ */
function addItem(){
  const medida   = $('#itemMedida').value.trim();
  const material = $('#itemMaterial').value;
  const qtd      = parseInt($('#itemQtd').value, 10);

  if (!medida){ alert('Informe a MEDIDA do estribo.'); $('#itemMedida').focus(); return; }
  if (!qtd || qtd <= 0){ alert('Informe a QUANTIDADE de peças.'); $('#itemQtd').focus(); return; }

  state.itens.push({ medida, material, qtd });
  $('#itemMedida').value = '';
  $('#itemQtd').value = '';
  $('#itemMedida').focus();
  renderItensTemp();
}
$('#btnAddItem').addEventListener('click', addItem);
['itemMedida','itemQtd'].forEach(id => {
  $('#'+id).addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
});

function renderItensTemp(){
  const ul = $('#listaItensTemp');
  if (!state.itens.length){ ul.innerHTML = ''; return; }
  ul.innerHTML = state.itens.map((it, idx) => `
    <li>
      <span>
        <span class="medida">${esc(it.medida)}</span> ·
        ⌀ ${esc(it.material)} mm ·
        <b>${fmtQtd(it.qtd)}</b> peças
      </span>
      <span style="display:flex;gap:8px;align-items:center">
        <span class="pac">${pacotesDe(it.qtd)} pct</span>
        <button type="button" class="perigo" data-del="${idx}">✕</button>
      </span>
    </li>`).join('');

  ul.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', () => {
      state.itens.splice(Number(b.dataset.del), 1);
      renderItensTemp();
    });
  });
}

/* ============================================================
   SALVAR / EDITAR / EXCLUIR
   ============================================================ */
$('#btnSalvar').addEventListener('click', () => {
  if (!state.clienteAtual){
    alert('⚠ O nome do CLIENTE é obrigatório.\nInforme o cliente para continuar.');
    abrirModalCliente();
    return;
  }
  if (!state.itens.length){
    alert('⚠ Adicione pelo menos 1 item (medida, material e quantidade).');
    return;
  }

  const dados = {
    cliente: state.clienteAtual,
    urgente: $('#urgente').checked,
    kg: parseFloat($('#kgPedido').value) || 0,
    obs: $('#obsPedido').value.trim(),
    itens: state.itens.map(i => ({...i}))
  };

  if (state.editandoId){
    const p = state.pedidos.find(x => x.id === state.editandoId);
    if (p) Object.assign(p, dados);
  } else {
    state.pedidos.push({
      id: 'p' + Date.now() + Math.random().toString(36).slice(2,6),
      criadoEm: Date.now(),
      ...dados
    });
  }

  registrarCliente(state.clienteAtual);
  persistir();
  limparFormulario();
  render();
});

function limparFormulario(){
  state.editandoId = null;
  state.clienteAtual = '';
  state.itens = [];
  $('#urgente').checked = false;
  $('#kgPedido').value = '';
  $('#obsPedido').value = '';
  $('#itemMedida').value = '';
  $('#itemQtd').value = '';
  $('#itemMaterial').value = '4.2';
  $('#btnCancelar').hidden = true;
  $('#btnSalvar').textContent = 'Salvar lançamento';
  $('#tituloForm').textContent = 'Novo Lançamento de Pedido';
  atualizarClienteUI();
  renderItensTemp();
}

$('#btnCancelar').addEventListener('click', limparFormulario);

/* Só é possível EDITAR ou EXCLUIR a partir do Lançamento de Pedidos (aba 1) */
function editarPedido(id){
  const p = state.pedidos.find(x => x.id === id);
  if (!p) return;
  state.editandoId = id;
  state.clienteAtual = p.cliente;
  state.itens = p.itens.map(i => ({...i}));
  $('#urgente').checked = !!p.urgente;
  $('#kgPedido').value = p.kg || '';
  $('#obsPedido').value = p.obs || '';
  $('#btnCancelar').hidden = false;
  $('#btnSalvar').textContent = 'Salvar alterações';
  $('#tituloForm').textContent = 'Editando lançamento';
  atualizarClienteUI();
  renderItensTemp();
  window.scrollTo({top:0, behavior:'smooth'});
}

function excluirPedido(id){
  const p = state.pedidos.find(x => x.id === id);
  if (!p) return;
  if (!confirm('Excluir o lançamento do cliente "' + p.cliente + '"?')) return;
  state.pedidos = state.pedidos.filter(x => x.id !== id);
  if (state.editandoId === id) limparFormulario();
  persistir();
  render();
}

/* ============================================================
   ORDENAÇÃO: urgência primeiro, depois cliente, depois data
   ============================================================ */
function ordenar(lista){
  return [...lista].sort((a,b) => {
    if (a.urgente !== b.urgente) return a.urgente ? -1 : 1;
    const ca = a.cliente.toLowerCase(), cb = b.cliente.toLowerCase();
    if (ca !== cb) return ca.localeCompare(cb, 'pt-BR');
    return a.criadoEm - b.criadoEm;
  });
}

/* ============================================================
   RENDER — ABA 1
   ============================================================ */
function render(){
  renderListaPedidos();
  renderFabrica();
  atualizarDatalist();
}

function renderListaPedidos(){
  const cont = $('#listaPedidos');
  if (!state.pedidos.length){
    cont.innerHTML = '<p class="vazio">Nenhum pedido lançado ainda.</p>';
    return;
  }

  cont.innerHTML = ordenar(state.pedidos).map(p => {
    const tPecas = p.itens.reduce((s,i) => s + i.qtd, 0);
    const tPac   = p.itens.reduce((s,i) => s + pacotesDe(i.qtd), 0);

    return `
    <article class="pedido ${p.urgente ? 'urgente' : ''}">
      <div class="pedido-head">
        <div>
          <span class="pedido-cliente">${esc(p.cliente)}</span>
          ${p.urgente ? '<span class="tag-urgente">URGENTE</span>' : ''}
        </div>
        <div class="pedido-data">Lançado em ${fmtData(p.criadoEm)}</div>
      </div>

      <table class="tabela">
        <thead>
          <tr>
            <th>Medida do estribo</th>
            <th>Material</th>
            <th class="num">Qtd. peças</th>
            <th class="num">Pacotes</th>
          </tr>
        </thead>
        <tbody>
          ${p.itens.map(i => `
            <tr>
              <td><b>${esc(i.medida)}</b></td>
              <td>${esc(i.material)} mm</td>
              <td class="num">${fmtQtd(i.qtd)}</td>
              <td class="num">${pacotesDe(i.qtd)}</td>
            </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2">TOTAL</td>
            <td class="num">${fmtQtd(tPecas)}</td>
            <td class="num">${tPac}</td>
          </tr>
        </tfoot>
      </table>

      <div class="pedido-rodape">
        <div class="info-extra">
          ${p.kg ? `⚖ <b>${fmtKg(p.kg)} kg</b> &nbsp;·&nbsp; ` : ''}
          ${p.obs ? `📝 ${esc(p.obs)}` : ''}
        </div>
        <div class="pedido-acoes">
          <button type="button" onclick="editarPedido('${p.id}')">✏ Editar</button>
          <button type="button" class="perigo" onclick="excluirPedido('${p.id}')">🗑 Excluir</button>
          <button type="button" onclick="pdfPedido('${p.id}')">📄 PDF</button>
        </div>
      </div>
    </article>`;
  }).join('');
}

/* ============================================================
   RENDER — ABA 2 (CHÃO DA FÁBRICA · somente leitura)
   ============================================================ */
function renderFabrica(){
  const lista = ordenar(state.pedidos);

  const tPecas = lista.reduce((s,p) => s + p.itens.reduce((a,i) => a + i.qtd, 0), 0);
  const tPac   = lista.reduce((s,p) => s + p.itens.reduce((a,i) => a + pacotesDe(i.qtd), 0), 0);
  const urg    = lista.filter(p => p.urgente).length;

  $('#fabricaResumo').innerHTML = `
    <div class="resumo-box"><span>Pedidos</span><strong>${lista.length}</strong></div>
    <div class="resumo-box ${urg ? 'urg' : ''}"><span>Urgentes</span><strong>${urg}</strong></div>
    <div class="resumo-box"><span>Total peças</span><strong>${fmtQtd(tPecas)}</strong></div>
    <div class="resumo-box"><span>Total pacotes</span><strong>${tPac}</strong></div>
  `;

  const cont = $('#fabricaLista');
  if (!lista.length){
    cont.innerHTML = '<p class="fabrica-vazio">Nenhum pedido em produção.</p>';
    return;
  }

  cont.innerHTML = lista.map(p => {
    const tP = p.itens.reduce((s,i) => s + i.qtd, 0);
    const tK = p.itens.reduce((s,i) => s + pacotesDe(i.qtd), 0);

    return `
    <div class="fabrica-card ${p.urgente ? 'urgente' : ''}">
      <div class="fabrica-top">
        <span class="fabrica-cliente">${esc(p.cliente)}</span>
        ${p.urgente ? '<span class="tag-urgente">URGENTE</span>' : ''}
      </div>

      <table class="tabela">
        <thead>
          <tr>
            <th>Medida</th><th>Material</th>
            <th class="num">Peças</th><th class="num">Pacotes</th>
          </tr>
        </thead>
        <tbody>
          ${p.itens.map(i => `
            <tr>
              <td><b>${esc(i.medida)}</b></td>
              <td>${esc(i.material)} mm</td>
              <td class="num">${fmtQtd(i.qtd)}</td>
              <td class="num"><b>${pacotesDe(i.qtd)}</b></td>
            </tr>`).join('')}
        </tbody>
      </table>

      <div class="fabrica-totais">
        <div><span>Peças</span><strong>${fmtQtd(tP)}</strong></div>
        <div><span>Pacotes</span><strong>${tK}</strong></div>
        ${p.kg ? `<div><span>KG</span><strong>${fmtKg(p.kg)}</strong></div>` : ''}
      </div>

      ${p.obs ? `<div class="fabrica-obs"><b>Obs.:</b> ${esc(p.obs)}</div>` : ''}
    </div>`;
  }).join('');
}

/* ============================================================
   PDF (impressão organizada e compacta)
   ============================================================ */
function montarHTMLPDF(lista, titulo){
  const agora = new Date().toLocaleString('pt-BR');
  let gPecas = 0, gPac = 0, gKg = 0;

  const blocos = lista.map(p => {
    const tPecas = p.itens.reduce((s,i) => s + i.qtd, 0);
    const tPac   = p.itens.reduce((s,i) => s + pacotesDe(i.qtd), 0);
    gPecas += tPecas; gPac += tPac; gKg += (p.kg || 0);

    return `
    <div class="pdf-pedido">
      <div class="pdf-pedido-top">
        <span class="pdf-cliente">${esc(p.cliente)}</span>
        ${p.urgente ? '<span class="pdf-urgente">URGENTE</span>' : ''}
        <span class="pdf-data">${fmtData(p.criadoEm)}</span>
      </div>
      <table class="pdf-tab">
        <thead>
          <tr>
            <th>Medida</th>
            <th>Material</th>
            <th class="num">Qtd (pç)</th>
            <th class="num">Pacotes</th>
          </tr>
        </thead>
        <tbody>
          ${p.itens.map(i => `
            <tr>
              <td>${esc(i.medida)}</td>
              <td>${esc(i.material)} mm</td>
              <td class="num">${fmtQtd(i.qtd)}</td>
              <td class="num">${pacotesDe(i.qtd)}</td>
            </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2">Total do pedido</td>
            <td class="num">${fmtQtd(tPecas)}</td>
            <td class="num">${tPac}</td>
          </tr>
        </tfoot>
      </table>
      <div class="pdf-info">
        ${p.kg ? `<span><b>KG:</b> ${fmtKg(p.kg)}</span>` : ''}
        ${p.obs ? `<span><b>Obs.:</b> ${esc(p.obs)}</span>` : ''}
      </div>
    </div>`;
  }).join('');

  return `
    <div class="pdf-header">
      <h1>${esc(titulo)}</h1>
      <div class="pdf-sub">
        Emitido em ${agora}<br>
        ${lista.length} pedido(s) · Regra: ${PECAS_POR_PACOTE} peças = 1 pacote
      </div>
    </div>
    ${blocos}
    <div class="pdf-totais">
      <span>TOTAL GERAL: ${fmtQtd(gPecas)} peças</span>
      <span>${gPac} pacotes</span>
      ${gKg ? `<span>${fmtKg(gKg)} kg</span>` : ''}
    </div>`;
}

function gerarPDF(lista, titulo){
  if (!lista.length){ alert('Nenhum pedido para imprimir.'); return; }
  $('#printArea').innerHTML = montarHTMLPDF(lista, titulo);
  setTimeout(() => window.print(), 80);
}

function pdfPedido(id){
  const p = state.pedidos.find(x => x.id === id);
  if (!p) return;
  gerarPDF([p], 'Pedido · ' + p.cliente);
}

$('#btnPDFGeral').addEventListener('click', () => {
  gerarPDF(ordenar(state.pedidos), 'Relação de Pedidos · Estribos');
});

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
carregar();
atualizarClienteUI();
atualizarDatalist();
renderItensTemp();
render();
</script>
</body>
</html>
