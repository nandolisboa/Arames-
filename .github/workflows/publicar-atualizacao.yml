name: Publicar atualizacao do controle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-atualizacao.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo oficial
        uses: actions/checkout@v4
        with:
          path: melhorias
      - name: Restaurar base e aplicar arquivos oficiais
        run: |
          mkdir app
          unzip -q melhorias/projeto-base-arames.zip -d app
          cp melhorias/CoilsPanel.tsx app/src/components/CoilsPanel.tsx
          cp melhorias/PdfPreviewDialog.tsx app/src/components/PdfPreviewDialog.tsx
          cp melhorias/App.tsx app/src/App.tsx
          cp melhorias/types.ts app/src/types.ts
          cp melhorias/coilWeights.ts app/src/lib/coilWeights.ts
          cp melhorias/ProductionPanel.tsx app/src/components/ProductionPanel.tsx
          cp melhorias/index.css app/src/index.css
          cp melhorias/reports.ts app/src/lib/reports.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Verificar codigo e compilar para o endereco oficial
        working-directory: app
        run: |
          bun run lint
          bun run build --base /Arames-/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
